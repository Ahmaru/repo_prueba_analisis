<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEFIDER USM - Detalles del Recurso</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex flex-column vh-100">

  <!-- Barra superior (Navbar) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center fw-bold fs-4" href="hu01-disponibilidad.html">
        <i class="bi bi-trophy-fill me-2 fs-3 text-warning"></i> DEFIDER USM
      </a>

      <div class="d-flex align-items-center text-white ms-auto">
        <div class="me-3 text-end d-none d-sm-block">
          <span id="nombreUsuarioNav" class="d-block fw-semibold">Juan Pérez</span>
          <small id="rolUsuarioNav" class="text-white-50">Consumidor</small>
        </div>
        <a href="revisar-reservas.html" class="btn btn-outline-light btn-sm me-2 d-flex align-items-center">
          <i class="bi bi-calendar-check me-1"></i> Mis reservas
        </a>
        <a href="index.html" onclick="cerrarSesion()" class="btn btn-outline-light btn-sm d-flex align-items-center">
          <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
        </a>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main class="container my-5 flex-grow-1">

    <!-- Botón de regresar -->
    <div class="mb-4">
      <a href="hu01-disponibilidad.html" class="btn btn-outline-secondary btn-sm fw-semibold">
        <i class="bi bi-arrow-left me-1"></i> Volver a Disponibilidad
      </a>
    </div>

    <!-- Contenedor dividido en 2 columnas (Lado Izquierdo y Lado Derecho) -->
    <div class="card shadow-sm border-0 p-4 rounded-4 bg-white">
      <div class="row g-4" id="contenedorDetalle">
        <!-- El contenido se genera dinámicamente desde detalle-recurso.js -->
      </div>
    </div>

  </main>

  <!-- Ventana Modal para la Reserva de Materiales (HU02 - Criterio 3) -->
  <div class="modal fade" id="modalReservaMaterial" tabindex="-1" aria-labelledby="modalReservaLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header bg-primary text-white border-0 rounded-top-4">
          <h5 class="modal-title fw-bold" id="modalReservaLabel">
            <i class="bi bi-box-seam me-2"></i> Solicitar Reserva de Material
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <h5 id="nombreMaterialModal" class="fw-bold text-dark mb-2"></h5>
          <p class="text-muted mb-3" id="stockDisponibleModal"></p>

          <div class="mb-3">
            <label for="inputCantidadDeseada" class="form-label fw-semibold">Cantidad deseada</label>
            <input type="number" class="form-control" id="inputCantidadDeseada" min="1" value="1">
          </div>

          <!-- Alerta de error cuando excede el stock -->
          <div id="errorStock" class="alert alert-danger d-none py-2 mb-0" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Excede el límite disponible, seleccione otra
          </div>
        </div>
        <div class="modal-footer border-0 px-4 pb-4">
          <button type="button" class="btn btn-outline-secondary px-4 fw-semibold" data-bs-dismiss="modal">Volver</button>
          <button type="button" class="btn btn-primary px-4 fw-bold" onclick="confirmarReservaMaterial()">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white text-center py-3 border-top mt-auto">
    <small class="text-muted">Universidad Técnica Federico Santa María — DEFIDER</small>
  </footer>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="api.js"></script>
  <!-- Script externo de lógica para la vista de detalle -->
  <script src="detalle-recurso.js"></script>
</body>
</html>
